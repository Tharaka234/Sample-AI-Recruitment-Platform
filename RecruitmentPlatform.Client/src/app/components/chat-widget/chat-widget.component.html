<!-- Floating Chat Button -->
<button 
  *ngIf="!chatService.isChatOpen()"
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center justify-center text-white z-50 animate-bounce-slight"
  aria-label="Open AI Assistant"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    <path d="M8 10h.01"></path>
    <path d="M12 10h.01"></path>
    <path d="M16 10h.01"></path>
  </svg>
</button>

<!-- Chat Window -->
<div 
  *ngIf="chatService.isChatOpen()"
  class="fixed bottom-6 right-6 w-80 sm:w-96 bg-white dark:bg-slate-900 border border-blue-100 dark:border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col z-50 chat-window-anim chat-window-dimensions"
>
  <!-- Header -->
  <div class="bg-gradient-to-r from-blue-600 to-cyan-500 p-4 flex items-center justify-between text-white">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path>
          <path d="M20 14h2"></path>
          <path d="M15 13v2"></path>
          <path d="M9 13v2"></path>
        </svg>
      </div>
      <div>
        <h3 class="font-semibold text-sm">TalentAI Assistant</h3>
        <p class="text-xs text-blue-100">Always here to help</p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-white/80 hover:text-white transition-colors p-1" aria-label="Close Chat">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Messages Area -->
  <div class="flex-1 p-4 overflow-y-auto bg-gray-50 dark:bg-slate-800/50" #messagesContainer>
    <div class="flex flex-col gap-4">
      <div *ngFor="let msg of chatService.messages()" 
           class="flex w-full"
           [ngClass]="msg.sender === 'user' ? 'justify-end' : 'justify-start'">
        
        <div class="max-w-[85%] rounded-2xl p-3 text-sm"
             [ngClass]="msg.sender === 'user' 
                ? 'bg-blue-600 text-white rounded-tr-sm' 
                : 'bg-white dark:bg-slate-700 text-gray-700 dark:text-gray-200 shadow-sm border border-gray-100 dark:border-slate-600 rounded-tl-sm'">
          <div [innerHTML]="msg.text" class="chat-message-text"></div>
          <p class="text-[10px] mt-1 text-right opacity-70">
            {{ msg.timestamp | date:'shortTime' }}
          </p>
        </div>
      </div>

      <!-- Typing indicator -->
      <div *ngIf="isLoading()" class="flex justify-start">
        <div class="bg-white dark:bg-slate-700 shadow-sm border border-gray-100 dark:border-slate-600 rounded-2xl rounded-tl-sm p-4 flex gap-1 items-center">
          <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce anim-delay-100"></div>
          <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce anim-delay-200"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-3 bg-white dark:bg-slate-900 border-t border-gray-100 dark:border-slate-800">
    <form (ngSubmit)="sendMessage()" class="flex items-center gap-2">
      <input 
        type="text" 
        [name]="'message'"
        [(ngModel)]="newMessage" 
        placeholder="Type your message..." 
        [disabled]="isLoading()"
        class="flex-1 bg-gray-50 dark:bg-slate-800 border-none rounded-full px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500/50 dark:text-white"
        autocomplete="off"
      >
      <button 
        type="submit" 
        [disabled]="isLoading() || !newMessage().trim()"
        class="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700 transition-colors shrink-0"
        aria-label="Send Message"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-[-2px]">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>
</div>
