<div class="min-h-screen bg-[#030712] text-slate-50 font-sans selection:bg-emerald-500/30 overflow-x-hidden relative">
  <!-- Background glowing orbs -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-emerald-600/10 blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-600/10 blur-[120px] pointer-events-none"></div>

  <!-- Navigation -->
  <nav class="fixed w-full z-50 top-0 transition-all duration-300 bg-[#030712]/80 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.3)] group-hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        </div>
        <span class="text-xl font-bold tracking-tight">Talent<span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">AI</span></span>
      </a>

      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
        <ng-container *ngIf="!auth.isRecruiter()">
          <a routerLink="/jobs" class="hover:text-emerald-400 transition-colors">Find Jobs</a>
        </ng-container>
        <ng-container *ngIf="!auth.isCandidate()">
          <a routerLink="/recruiters" class="hover:text-emerald-400 transition-colors">For Recruiters</a>
        </ng-container>
        <a routerLink="/insights" class="hover:text-emerald-400 transition-colors">AI Insights</a>
        <ng-container *ngIf="auth.isHiringManager()">
          <a routerLink="/hiring-manager" class="hover:text-emerald-400 transition-colors">Hiring Dashboard</a>
        </ng-container>
        <ng-container *ngIf="auth.isAdmin()">
          <a routerLink="/admin" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Admin Panel</a>
        </ng-container>

        <ng-container *ngIf="user; else loggedOut">
          <a routerLink="/dashboard"
             class="flex items-center gap-2 text-white px-5 py-2.5 rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 shadow-[0_4px_20px_rgba(16,185,129,0.25)] hover:shadow-[0_4px_25px_rgba(16,185,129,0.4)] transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            {{ user.firstName || 'Dashboard' }}
          </a>
          <button (click)="logout()"
                  class="flex items-center gap-2 text-slate-300 px-4 py-2.5 rounded-full bg-white/5 border border-white/10 hover:bg-rose-500/10 hover:border-rose-500/20 hover:text-rose-400 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Logout
          </button>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/signin" class="text-white px-5 py-2.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 hover:text-emerald-300 transition-colors">
            Sign In
          </a>
          <a routerLink="/signin" class="text-white px-5 py-2.5 rounded-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 shadow-[0_4px_20px_rgba(16,185,129,0.25)] hover:shadow-[0_4px_25px_rgba(16,185,129,0.4)] transition-all">
            Get Started
          </a>
        </ng-template>
      </div>

      <button class="md:hidden text-slate-300 hover:text-emerald-400 transition-colors" (click)="toggleMenu()" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden bg-[#030712] border-b border-white/10 px-6 py-4 flex flex-col gap-4">
      <ng-container *ngIf="!auth.isRecruiter()">
        <a routerLink="/jobs" class="text-slate-300 hover:text-emerald-400" (click)="isMenuOpen=false">Find Jobs</a>
      </ng-container>
      <ng-container *ngIf="!auth.isCandidate()">
        <a routerLink="/recruiters" class="text-slate-300 hover:text-emerald-400" (click)="isMenuOpen=false">For Recruiters</a>
      </ng-container>
      <a routerLink="/insights" class="text-slate-300 hover:text-emerald-400" (click)="isMenuOpen=false">AI Insights</a>
      <ng-container *ngIf="auth.isHiringManager()">
        <a routerLink="/hiring-manager" class="text-slate-300 hover:text-emerald-400" (click)="isMenuOpen=false">Hiring Dashboard</a>
      </ng-container>
      <ng-container *ngIf="auth.isAdmin()">
        <a routerLink="/admin" class="text-purple-400 hover:text-purple-300 font-medium" (click)="isMenuOpen=false">Admin Panel</a>
      </ng-container>
      <ng-container *ngIf="user; else mobileLoggedOut">
        <a routerLink="/dashboard" class="text-emerald-400 hover:text-emerald-300 font-medium" (click)="isMenuOpen=false">
          Dashboard ({{ user.firstName }})
        </a>
        <button (click)="logout()" class="text-rose-400 hover:text-rose-300 text-left">Logout</button>
      </ng-container>
      <ng-template #mobileLoggedOut>
        <a routerLink="/signin" class="text-emerald-400 font-medium py-2" (click)="isMenuOpen=false">Sign In</a>
      </ng-template>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="pt-20 relative z-10">
    <router-outlet></router-outlet>
  </main>
</div>
