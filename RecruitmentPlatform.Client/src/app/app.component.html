<div class="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-500/30 overflow-x-hidden relative">
  <!-- Background glowing orbs -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/10 blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600/10 blur-[120px] pointer-events-none"></div>

  <!-- Navigation -->
  <nav class="fixed w-full z-50 top-0 transition-all duration-300 bg-white/80 backdrop-blur-xl border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 group">
        <img src="assets/logo.png" alt="TalentAI Logo" class="w-12 h-12 object-contain group-hover:scale-105 transition-transform drop-shadow-sm">
        <span class="text-2xl font-bold tracking-tight text-[#041a4a]">Talent<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-cyan-500">AI</span></span>
      </a>

      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <ng-container *ngIf="!auth.isRecruiter()">
          <a routerLink="/jobs" class="hover:text-blue-600 transition-colors">Find Jobs</a>
        </ng-container>
        <ng-container *ngIf="!auth.isCandidate()">
          <a routerLink="/recruiters" class="hover:text-blue-600 transition-colors">For Recruiters</a>
        </ng-container>
        <a *ngIf="user" routerLink="/dashboard" class="text-slate-600 hover:text-blue-600 transition-colors text-sm font-medium">Dashboard</a>
        <a *ngIf="user" routerLink="/profile" class="text-slate-600 hover:text-blue-600 transition-colors text-sm font-medium">My Profile</a>
        <a routerLink="/insights" class="hover:text-purple-600 transition-colors">AI Insights</a>
        <ng-container *ngIf="auth.isHiringManager()">
          <a routerLink="/hiring-manager" class="hover:text-blue-600 transition-colors">Hiring Dashboard</a>
        </ng-container>
        <ng-container *ngIf="auth.isAdmin()">
          <a routerLink="/admin" class="text-slate-600 hover:text-purple-600 font-medium transition-colors">Admin Panel</a>
        </ng-container>

        <ng-container *ngIf="user; else loggedOut">
          <a routerLink="/dashboard"
             class="flex items-center gap-2 text-white px-5 py-2.5 rounded-full bg-gradient-to-r from-blue-600 via-purple-600 to-cyan-500 hover:opacity-90 shadow-[0_4px_20px_rgba(37,99,235,0.25)] hover:shadow-[0_4px_25px_rgba(37,99,235,0.4)] transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            {{ user.firstName || 'Dashboard' }}
          </a>
          <button (click)="logout()"
                  class="flex items-center gap-2 text-slate-700 px-4 py-2.5 rounded-full bg-white border border-slate-200 hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 shadow-sm transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Logout
          </button>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/signin" class="text-slate-700 px-5 py-2.5 rounded-full bg-white border border-slate-200 hover:bg-slate-50 transition-colors shadow-sm">
            Sign In
          </a>
          <a routerLink="/signin" class="text-white px-5 py-2.5 rounded-full bg-gradient-to-r from-blue-600 via-purple-600 to-cyan-500 hover:opacity-90 shadow-[0_4px_20px_rgba(37,99,235,0.25)] hover:shadow-[0_4px_25px_rgba(37,99,235,0.4)] transition-all">
            Get Started
          </a>
        </ng-template>
      </div>

      <button class="md:hidden text-slate-600 hover:text-blue-600 transition-colors" (click)="toggleMenu()" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isMenuOpen" class="md:hidden bg-white border-b border-slate-200 px-6 py-4 flex flex-col gap-4 shadow-sm">
      <ng-container *ngIf="!auth.isRecruiter()">
        <a routerLink="/jobs" class="text-slate-600 hover:text-blue-600" (click)="isMenuOpen=false">Find Jobs</a>
      </ng-container>
      <ng-container *ngIf="!auth.isCandidate()">
        <a routerLink="/recruiters" class="text-slate-600 hover:text-blue-600" (click)="isMenuOpen=false">For Recruiters</a>
      </ng-container>
      <a routerLink="/insights" class="text-slate-600 hover:text-purple-600" (click)="isMenuOpen=false">AI Insights</a>
      <ng-container *ngIf="auth.isHiringManager()">
        <a routerLink="/hiring-manager" class="text-slate-600 hover:text-blue-600" (click)="isMenuOpen=false">Hiring Dashboard</a>
      </ng-container>
      <ng-container *ngIf="auth.isAdmin()">
        <a routerLink="/admin" class="text-slate-600 hover:text-purple-600 font-medium" (click)="isMenuOpen=false">Admin Panel</a>
      </ng-container>
      <ng-container *ngIf="user; else mobileLoggedOut">
        <a routerLink="/dashboard" class="text-blue-600 font-medium" (click)="isMenuOpen=false">
          Dashboard ({{ user.firstName }})
        </a>
        <a routerLink="/profile" class="text-slate-600 hover:text-blue-600 font-medium" (click)="isMenuOpen=false">My Profile</a>
        <button (click)="logout()" class="text-rose-600 hover:text-rose-500 text-left font-medium">Logout</button>
      </ng-container>
      <ng-template #mobileLoggedOut>
        <a routerLink="/signin" class="text-blue-600 font-medium py-2" (click)="isMenuOpen=false">Sign In</a>
      </ng-template>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="pt-20 relative z-10">
    <router-outlet></router-outlet>
  </main>
</div>
