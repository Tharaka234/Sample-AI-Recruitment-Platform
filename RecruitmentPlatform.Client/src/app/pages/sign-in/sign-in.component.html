<div class="min-h-[90vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full blur-[128px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-[128px] pointer-events-none"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <a routerLink="/" class="flex justify-center mb-6 group">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      </div>
    </a>
    <h2 class="text-center text-3xl font-extrabold text-slate-900">
      {{ isLogin ? 'Welcome Back' : 'Create an Account' }}
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      Or
      <button (click)="toggleMode()" class="font-medium text-blue-600 hover:text-blue-700 transition-colors">
        {{ isLogin ? 'create a new account' : 'sign in to existing account' }}
      </button>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="bg-white py-8 px-4 shadow-xl sm:rounded-2xl sm:px-10 border border-slate-200">
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div *ngIf="error" [class]="'px-4 py-3 rounded-xl text-sm flex items-center gap-2 ' + (error.includes('successful') ? 'bg-emerald-50 border border-emerald-200 text-emerald-700' : 'bg-rose-50 border border-rose-200 text-rose-700')">
          <div [class]="'w-1.5 h-1.5 rounded-full shrink-0 ' + (error.includes('successful') ? 'bg-emerald-500' : 'bg-rose-500')"></div>
          {{ error }}
        </div>

        <div *ngIf="!isLogin" class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-medium text-slate-700 mb-1">First Name</label>
            <input id="firstName" placeholder="First Name" required [(ngModel)]="firstName" name="firstName" class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm transition-all" />
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-slate-700 mb-1">Last Name</label>
            <input id="lastName" placeholder="Last Name" required [(ngModel)]="lastName" name="lastName" class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm transition-all" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-slate-400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </div>
            <input required type="email" [(ngModel)]="email" name="email" class="appearance-none block w-full pl-11 pr-4 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm transition-all" placeholder="you@example.com" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-slate-400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input required type="password" [(ngModel)]="password" name="password" class="appearance-none block w-full pl-11 pr-4 py-3 border border-slate-300 rounded-xl bg-white text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm transition-all" placeholder="••••••••" />
          </div>
        </div>

        <div *ngIf="!isLogin">
          <label class="block text-sm font-medium text-slate-700 mb-2">I am a...</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" (click)="role='Candidate'" [class]="'py-3 px-2 rounded-xl border flex items-center justify-center transition-all text-xs font-semibold ' + (role === 'Candidate' ? 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100')">
              Candidate
            </button>
            <button type="button" (click)="role='Recruiter'" [class]="'py-3 px-2 rounded-xl border flex items-center justify-center transition-all text-xs font-semibold ' + (role === 'Recruiter' ? 'bg-purple-50 border-purple-200 text-purple-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100')">
              Recruiter
            </button>
            <button type="button" (click)="role='HiringManager'" [class]="'py-3 px-2 rounded-xl border flex items-center justify-center transition-all text-xs font-semibold ' + (role === 'HiringManager' ? 'bg-cyan-50 border-cyan-200 text-cyan-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100')">
              Hiring Manager
            </button>
            <button type="button" (click)="role='Admin'" [class]="'py-3 px-2 rounded-xl border flex items-center justify-center transition-all text-xs font-semibold ' + (role === 'Admin' ? 'bg-amber-50 border-amber-200 text-amber-700 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100')">
              Admin
            </button>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="loading"
            class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-md hover:shadow-lg text-sm font-bold text-white bg-gradient-to-r from-blue-600 via-purple-600 to-cyan-500 hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all disabled:opacity-50">
            {{ isLogin ? 'Sign In' : 'Create Account' }}
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
