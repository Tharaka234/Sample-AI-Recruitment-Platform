<div class="max-w-7xl mx-auto px-6 py-12" *ngIf="user">
  <!-- Welcome Header -->
  <div class="mb-12">
    <h1 class="text-4xl md:text-5xl font-bold mb-2 text-white">
      Candidate Dashboard
    </h1>
    <p class="text-slate-400 text-lg">
      Welcome back, {{ user.firstName || 'User' }}! Track your applications and discover new opportunities.
    </p>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
    <div *ngFor="let stat of statCards"
         class="p-6 rounded-2xl bg-white/[0.03] border border-white/5 text-center backdrop-blur-sm hover:bg-white/[0.05] transition-colors">
      <p class="text-3xl font-bold text-white mb-1">{{ stat.value }}</p>
      <p class="text-sm text-slate-400">{{ stat.label }}</p>
    </div>
  </div>

  <!-- Quick Actions -->
  <div>
    <h2 class="text-2xl font-bold mb-6 text-white">Quick Actions</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <button *ngFor="let action of actions" (click)="navigate(action.link)"
              class="p-6 rounded-2xl bg-white/[0.02] border border-white/5 hover:bg-white/[0.05] transition-colors text-left flex items-start gap-5 group relative overflow-hidden backdrop-blur-sm">
        <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        <div [class]="'relative z-10 w-14 h-14 rounded-xl bg-gradient-to-br ' + action.color + ' flex items-center justify-center text-white shrink-0 shadow-lg shadow-emerald-500/20 group-hover:shadow-emerald-500/30 transition-shadow'">
          <!-- Generic Icon for all for simplicity -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div class="relative z-10">
          <h3 class="text-lg font-semibold text-white mb-1 group-hover:text-emerald-300 transition-colors">{{ action.title }}</h3>
          <p class="text-slate-400 text-sm leading-relaxed">{{ action.desc }}</p>
        </div>
      </button>
    </div>
  </div>

  <!-- Account Info -->
  <div class="mt-12 p-6 rounded-2xl bg-white/[0.02] border border-white/5 backdrop-blur-sm hover:bg-white/[0.04] transition-colors">
    <h2 class="text-lg font-semibold mb-4 text-white">Account Details</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
      <div>
        <p class="text-slate-500 mb-1 font-medium">Email</p>
        <p class="text-slate-300">{{ user.email }}</p>
      </div>
      <div>
        <p class="text-slate-500 mb-1 font-medium">Role</p>
        <p class="text-slate-300">{{ user.role }}</p>
      </div>
      <div>
        <p class="text-slate-500 mb-1 font-medium">Name</p>
        <p class="text-slate-300">{{ user.firstName }}</p>
      </div>
    </div>
  </div>
</div>
