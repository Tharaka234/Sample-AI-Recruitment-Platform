<div class="max-w-7xl mx-auto px-6 py-12" *ngIf="user">
  <!-- Welcome Header -->
  <div class="mb-12">
    <h1 class="text-4xl md:text-5xl font-bold mb-2 text-slate-900">
      {{ title }}
    </h1>
    <p class="text-slate-600 text-lg">
      {{ subtitle }}
    </p>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
    <div *ngFor="let stat of statCards"
         class="p-6 rounded-2xl bg-white border border-slate-200 shadow-sm text-center hover:bg-slate-50 hover:shadow-md transition-all">
      <p class="text-3xl font-bold text-slate-900 mb-1">{{ stat.value }}</p>
      <p class="text-sm text-slate-600">{{ stat.label }}</p>
    </div>
  </div>

  <!-- Quick Actions -->
  <div>
    <h2 class="text-2xl font-bold mb-6 text-slate-900">Quick Actions</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <button *ngFor="let action of actions" (click)="navigate(action.link)"
              class="p-6 rounded-2xl bg-white border border-slate-200 shadow-sm hover:bg-slate-50 hover:shadow-md transition-all text-left flex items-start gap-5 group relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-blue-600/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        <div [class]="'relative z-10 w-14 h-14 rounded-xl bg-gradient-to-br ' + action.color + ' flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-500/20 group-hover:shadow-blue-500/30 transition-shadow'">
          <!-- Generic Icon for all for simplicity -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <div class="relative z-10">
          <h3 class="text-lg font-semibold text-slate-900 mb-1 group-hover:text-blue-600 transition-colors">{{ action.title }}</h3>
          <p class="text-slate-600 text-sm leading-relaxed">{{ action.desc }}</p>
        </div>
      </button>
    </div>
  </div>

  <!-- Account Info -->
  <div class="mt-12 p-6 rounded-2xl bg-white border border-slate-200 shadow-sm hover:shadow-md transition-all">
    <h2 class="text-lg font-semibold mb-4 text-slate-900">Account Details</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
      <div>
        <p class="text-slate-500 mb-1 font-medium">Email</p>
        <p class="text-slate-700">{{ user.email }}</p>
      </div>
      <div>
        <p class="text-slate-500 mb-1 font-medium">Role</p>
        <p class="text-slate-700">{{ user.role }}</p>
      </div>
      <div>
        <p class="text-slate-500 mb-1 font-medium">Name</p>
        <p class="text-slate-700">{{ user.firstName }}</p>
      </div>
    </div>
  </div>
</div>
